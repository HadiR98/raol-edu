<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی با اعداد | جمع و تفریق دو رقمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#22a559;
    --green-dark:#178a45;
    --red:#e0483e;
    --gold:#f6c343;
    --ink:#2c3e50;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    overflow:hidden;
    background:#0b2a3a;
    font-family:'Vazirmatn','Tahoma',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex;align-items:center;justify-content:center;
  }
  #stage{
    position:relative;
    background:#000;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  #bg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:fill;
    display:block;
    user-select:none;pointer-events:none;
  }
  .ov{position:absolute;}

  /* ---- Wallet (top-left) ---- */
  #walletBox{
    left:11.7%; top:4.1%; width:16.6%; height:5.1%;
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:800;
    letter-spacing:1px;
  }
  #walletBox .val{font-size:min(3.1vh,2.5vw);}

  /* ---- Stage circles (top-right) ---- */
  #stageDots{
    left:77.1%; top:4.1%; width:19.6%; height:5.1%;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 2%;
  }
  .dot{
    width:16%; aspect-ratio:1/1; border-radius:50%;
    background:transparent;
    transition:background .25s, transform .25s;
  }
  .dot.done{
    background:#3ddc73;
    box-shadow:0 0 6px #3ddc73;
  }
  .dot.current{
    box-shadow:0 0 0 2px #fff inset;
    transform:scale(1.15);
  }

  /* ---- Feedback message (right cream box) ---- */
  #feedbackBox{
    left:69.3%; top:18.5%; width:23%; height:23%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:3%;
    font-weight:700;
    color:var(--ink);
    font-size:min(2.05vh,1.7vw);
    line-height:1.5;
    overflow:hidden;
  }
  #feedbackBox.correct{color:var(--green-dark);}
  #feedbackBox.wrong{color:var(--red);}

  /* ---- Mission text (bottom cream box) ---- */
  #missionBox{
    left:22.8%; top:46.8%; width:65%; height:13.6%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:1% 2%;
    color:var(--ink);
    font-weight:700;
    font-size:min(2.15vh,1.75vw);
    line-height:1.55;
    overflow:hidden;
  }

  /* ---- Calc boxes (coordinates measured directly from the artwork's dashed squares) ---- */
  .calcBox{position:absolute; transition:opacity .3s;}
  .calcBox.disabled{opacity:.32; filter:grayscale(60%);}
  #plusBox{ left:13.6%; top:63.7%; width:35.0%; height:25.0%; }
  #minusBox{ left:51.1%; top:63.7%; width:35.7%; height:25.0%; }

  .digit{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    border:none; background:transparent; outline:none;
    text-align:center; padding:0;
    font-family:'Vazirmatn','Tahoma',sans-serif;
    font-weight:800; color:var(--ink);
    font-size:min(4.4vh,3.5vw);
  }
  .digit.readonly{ color:#3a6b8a; }
  .digit.answer{ color:var(--green-dark); background:rgba(255,255,255,.55); border-radius:8px; }
  .digit.answer:focus{ background:rgba(255,255,255,.85); box-shadow:0 0 0 2px var(--green) inset; }
  .digit::placeholder{color:#9fb8c8;}
  .digit:disabled{ -webkit-text-fill-color:#3a6b8a; opacity:1; }

  /* row vertical position/height is identical for both boxes (same artwork row) */
  #plusBox .r1a, #plusBox .r1b, #minusBox .r1a, #minusBox .r1b{ top:29.7%; height:15.6%; }
  #plusBox .r2a, #plusBox .r2b, #minusBox .r2a, #minusBox .r2b{ top:48.7%; height:15.6%; }
  #plusBox .r3a, #plusBox .r3b, #minusBox .r3a, #minusBox .r3b{ top:72.7%; height:16.4%; }

  /* plus box digit columns */
  #plusBox .r1a, #plusBox .r2a, #plusBox .r3a{ left:33.0%; width:17.6%; }
  #plusBox .r1b, #plusBox .r2b, #plusBox .r3b{ left:55.3%; width:17.6%; }

  /* minus box digit columns (its container is a different width, so its % differ) */
  #minusBox .r1a, #minusBox .r2a, #minusBox .r3a{ left:29.2%; width:17.2%; }
  #minusBox .r1b, #minusBox .r2b, #minusBox .r3b{ left:50.8%; width:17.2%; }

  /* ---- Submit button ---- */
  #checkBtn{
    left:31.2%; top:89.6%; width:37.6%; height:5.9%;
    background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #checkBtn span{
    color:#fff; font-weight:800; font-size:min(2.7vh,2.2vw);
    letter-spacing:.5px;
  }
  #checkBtn:active{transform:scale(.97);}

  #shake{animation:shakeAnim .35s;}
  @keyframes shakeAnim{
    10%,90%{transform:translateX(-1%);}
    20%,80%{transform:translateX(2%);}
    30%,50%,70%{transform:translateX(-4%);}
    40%,60%{transform:translateX(4%);}
  }

  #winOverlay{
    position:absolute; inset:0; background:rgba(10,40,30,.82);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; color:#fff; padding:6%; z-index:50;
  }
  #winOverlay h1{font-size:min(4vh,3.4vw); margin:0 0 3%;}
  #winOverlay p{font-size:min(2.2vh,1.9vw); margin:0 0 5%; line-height:1.6;}
  #winOverlay button{
    background:var(--green); color:#fff; border:none; border-radius:999px;
    padding:2.5% 8%; font-family:inherit; font-weight:800; cursor:pointer;
    font-size:min(2.2vh,1.9vw);
  }
</style>
</head>

    <input class="digit answer r3a" id="p_r3a" maxlength="1" inputmode="numeric">
    <input class="digit answer r3b" id="p_r3b" maxlength="1" inputmode="numeric">
  </div>

  <div id="minusBox" class="ov calcBox">
    <input class="digit readonly r1a" id="m_r1a" disabled>
    <input class="digit readonly r1b" id="m_r1b" disabled>
    <input class="digit readonly r2a" id="m_r2a" disabled>
    <input class="digit readonly r2b" id="m_r2b" disabled>
    <input class="digit answer r3a" id="m_r3a" maxlength="1" inputmode="numeric">
    <input class="digit answer r3b" id="m_r3b" maxlength="1" inputmode="numeric">
  </div>

  <button id="checkBtn" class="ov"><span>بررسی جواب ✅</span></button>

  <div id="winOverlay">
    <h1>🎉 آفرین قهرمان! 🎉</h1>
    <p>تو همه‌ی ۸ مرحله‌ی «بازی با اعداد» رو با موفقیت رد کردی و یک خریدار حرفه‌ای شدی!</p>
    <button id="restartBtn">شروع دوباره</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- fit stage to viewport, keep image ratio 1024x1536 ---------- */
  var RATIO = 1024/1536;
  var stage = document.getElementById('stage');
  function fit(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var h = vh, w = h*RATIO;
    if(w>vw){ w=vw; h=w/RATIO; }
    stage.style.width = w+'px';
    stage.style.height = h+'px';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- Persian digit helpers ---------- */
  var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function toFa(n){ return String(n).split('').map(function(c){return /[0-9]/.test(c)?FA[+c]:c;}).join(''); }
  function faDigit(d){ return FA[d]; }

  /* ---------- shop data ---------- */
  var ITEMS = [
    {id:'ball',   name:'توپ',            price:14},
    {id:'pencil', name:'مداد',           price:11},
    {id:'teddy',  name:'عروسک خرسی',     price:17},
    {id:'book',   name:'کتاب',           price:15},
    {id:'car',    name:'ماشین اسباب‌بازی', price:16},
    {id:'bag',    name:'کیف مدرسه',       price:24}
  ];
  // pairs with no carrying in the units digit (kept simple/clean for 2nd graders)
  var ADD_PAIRS = [[0,1],[0,3],[0,5],[1,2],[1,3],[1,4],[1,5],[3,5]];

  function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(arr){ return arr[rand(0,arr.length-1)]; }
  function units(n){ return n%10; }

  function pickNoCarryDelta(base, capMax){
    var cap = Math.min(89, capMax===undefined?89:capMax);
    var opts=[];
    for(var d=10; d<=cap; d++){
      if(units(base)+units(d)<=9 && (base+d)<=99) opts.push(d);
    }
    if(opts.length===0) return 10;
    return pick(opts);
  }

  var TOTAL_STAGES = 8;

  function typeForStage(i){
    if(i<2) return 'add';
    if(i<4) return 'sub';
    if(i<6) return Math.random()<0.5?'add':'sub';
    return 'combo';
  }

  function buildMission(stageIndex){
    var type = typeForStage(stageIndex);

    if(type==='add'){
      var pr = pick(ADD_PAIRS);
      var it1 = ITEMS[pr[0]], it2 = ITEMS[pr[1]];
      var answer = it1.price + it2.price;
      var wallet = rand(45,99);
      return {
        type:'add', item1:it1, item2:it2, answer:answer, wallet:wallet,
        question: 'اگه بخوای «'+it1.name+'» و «'+it2.name+'» رو با هم بخری، باید چند سکه به فروشنده بدی؟'
      };
    }

    if(type==='sub'){
      var it = pick(ITEMS);
      var delta = pickNoCarryDelta(it.price, 99-it.price);
      var wallet2 = it.price + delta;
      return {
        type:'sub', item:it, wallet:wallet2, answer:delta,
        question: 'اگه '+toFa(wallet2)+' سکه داشته باشی و یک «'+it.name+'» بخری، چند سکه برات باقی می‌مونه؟'
      };
    }

    // combo
    var pr2 = pick(ADD_PAIRS);
    var c1 = ITEMS[pr2[0]], c2 = ITEMS[pr2[1]];
    var sum = c1.price + c2.price;
    var delta2 = pickNoCarryDelta(sum, 99-sum);
    var wallet3 = sum + delta2;
    return {
      type:'combo', item1:c1, item2:c2, sum:sum, wallet:wallet3,
      answer1:sum, answer2:delta2,
      question: 'اگه '+toFa(wallet3)+' سکه داشته باشی و یک «'+c1.name+'» و یک «'+c2.name+'» بخری، چند سکه برات باقی می‌مونه؟ (اول قیمت‌ها رو جمع بزن، بعد از سکه‌هات کم کن)'
    };
  }

  /* ---------- state ---------- */
  var stageIndex = 0;
  var mission = null;
  var comboStep = 'add'; // 'add' then 'sub', only used for combo missions

  var walletVal = document.getElementById('walletVal');
  var stageDots = document.getElementById('stageDots');
  var feedbackBox = document.getElementById('feedbackBox');
  var missionBox = document.getElementById('missionBox');
  var plusBox = document.getElementById('plusBox');
  var minusBox = document.getElementById('minusBox');
  var winOverlay = document.getElementById('winOverlay');

  var pInputs = { r1a:$('p_r1a'), r1b:$('p_r1b'), r2a:$('p_r2a'), r2b:$('p_r2b'), r3a:$('p_r3a'), r3b:$('p_r3b') };
  var mInputs = { r1a:$('m_r1a'), r1b:$('m_r1b'), r2a:$('m_r2a'), r2b:$('m_r2b'), r3a:$('m_r3a'), r3b:$('m_r3b') };

  function $(id){ return document.getElementById(id); }

  function buildDots(){
    stageDots.innerHTML='';
    for(var i=0;i<TOTAL_STAGES;i++){
      var d=document.createElement('div');
      d.className='dot'+(i<stageIndex?' done':'')+(i===stageIndex?' current':'');
      stageDots.appendChild(d);
    }
  }

  function setTwoDigits(inputs, n, readonly){
    var s = String(n);
    var t = s.length>1 ? s[0] : '0';
    var u = s.length>1 ? s[1] : s[0];
    inputs.r1a; // no-op reference
    inputs.a1 = t; inputs.a2 = u;
  }

  function fillRow(el1, el2, n){
    var s=String(n);
    var t = s.length>1? s[0]: '0';
    var u = s.length>1? s[1]: s[0];
    el1.value = faDigit(+t);
    el2.value = faDigit(+u);
  }

  function clearAnswer(el1, el2){
    el1.value=''; el2.value='';
    el1.disabled=false; el2.disabled=false;
  }

  function lockAnswer(el1, el2, n){
    fillRow(el1, el2, n);
    el1.disabled=true; el2.disabled=true;
  }

  function setBoxState(box, active){
    if(active){ box.classList.remove('disabled'); }
    else{ box.classList.add('disabled'); }
  }

  function clearBoxDisplay(inputs){
    inputs.r1a.value=''; inputs.r1b.value='';
    inputs.r2a.value=''; inputs.r2b.value='';
    inputs.r3a.value=''; inputs.r3b.value='';
    inputs.r3a.disabled=false; inputs.r3b.disabled=false;
  }

  function renderWallet(){
    walletVal.textContent = toFa(mission.wallet);
  }

  function renderMissionText(){
    missionBox.textContent = mission.question;
  }

  function resetFeedback(msg, cls){
    feedbackBox.className='ov';
    if(cls) feedbackBox.classList.add(cls);
    feedbackBox.textContent = msg;
  }

  function loadStage(i){
    stageIndex = i;
    mission = buildMission(i);
    comboStep = 'add';
    buildDots();
    renderWallet();
    renderMissionText();
    resetFeedback('روی مسئله فکر کن و پایین حساب کن 🧮');

    clearBoxDisplay(pInputs);
    clearBoxDisplay(mInputs);

    if(mission.type==='add'){
      setBoxState(plusBox, true);
      setBoxState(minusBox, false);
      fillRow(pInputs.r1a, pInputs.r1b, mission.item1.price);
      fillRow(pInputs.r2a, pInputs.r2b, mission.item2.price);
      pInputs.r3a.disabled=false; pInputs.r3b.disabled=false;
    } else if(mission.type==='sub'){
      setBoxState(plusBox, false);
      setBoxState(minusBox, true);
      fillRow(mInputs.r1a, mInputs.r1b, mission.wallet);
      fillRow(mInputs.r2a, mInputs.r2b, mission.item.price);
      mInputs.r3a.disabled=false; mInputs.r3b.disabled=false;
    } else { // combo, step 1 = add
      setBoxState(plusBox, true);
      setBoxState(minusBox, false);
      fillRow(pInputs.r1a, pInputs.r1b, mission.item1.price);
      fillRow(pInputs.r2a, pInputs.r2b, mission.item2.price);
      pInputs.r3a.disabled=false; pInputs.r3b.disabled=false;
    }

    setTimeout(function(){
      var first = mission.type==='sub' ? mInputs.r3a : pInputs.r3a;
      if(first) first.focus();
    }, 50);
  }

  function readAnswer(el1, el2){
    var faMap = {'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9};
    function val(el){
      var v=(el.value||'').trim();
      if(v==='') return null;
      if(faMap.hasOwnProperty(v)) return faMap[v];
      if(/^[0-9]$/.test(v)) return +v;
      return null;
    }
    var a=val(el1), b=val(el2);
    if(a===null||b===null) return null;
    return a*10+b;
  }

  function shake(){
    var s=document.getElementById('stage');
    s.classList.remove('shake'); void s.offsetWidth;
    s.id='stage';
    document.getElementById('stage').classList.add('shake');
    setTimeout(function(){document.getElementById('stage').classList.remove('shake');},350);
  }

  function celebrateDotAndAdvance(){
    resetFeedback('🎉 آفرین! درست حساب کردی!', 'correct');
    stageIndex++;
    setTimeout(function(){
      if(stageIndex>=TOTAL_STAGES){
        buildDots();
        winOverlay.style.display='flex';
      } else {
        loadStage(stageIndex);
      }
    }, 950);
  }

  function checkAnswer(){
    if(mission.type==='add'){
      var got = readAnswer(pInputs.r3a, pInputs.r3b);
      if(got===null){ resetFeedback('اول جواب رو داخل خونه‌های خالی بنویس ✍️'); return; }
      if(got===mission.answer){
        lockAnswer(pInputs.r3a, pInputs.r3b, mission.answer);
        celebrateDotAndAdvance();
      } else {
        resetFeedback('❌ اشتباهه، دوباره حساب کن.', 'wrong'); shake();
      }
      return;
    }

    if(mission.type==='sub'){
      var got2 = readAnswer(mInputs.r3a, mInputs.r3b);
      if(got2===null){ resetFeedback('اول جواب رو داخل خونه‌های خالی بنویس ✍️'); return; }
      if(got2===mission.answer){
        lockAnswer(mInputs.r3a, mInputs.r3b, mission.answer);
        celebrateDotAndAdvance();
      } else {
        resetFeedback('❌ اشتباهه، دوباره حساب کن.', 'wrong'); shake();
      }
      return;
    }

    // combo
    if(comboStep==='add'){
      var gotSum = readAnswer(pInputs.r3a, pInputs.r3b);
      if(gotSum===null){ resetFeedback('اول جمع دو قیمت رو بنویس ✍️'); return; }
      if(gotSum===mission.answer1){
        lockAnswer(pInputs.r3a, pInputs.r3b, mission.answer1);
        resetFeedback('👍 جمع درست بود! حالا از '+toFa(mission.wallet)+' سکه‌ات کم کن.', 'correct');
        setBoxState(minusBox, true);
        fillRow(mInputs.r1a, mInputs.r1b, mission.wallet);
        fillRow(mInputs.r2a, mInputs.r2b, mission.sum);
        mInputs.r3a.disabled=false; mInputs.r3b.disabled=false;
        comboStep='sub';
        setTimeout(function(){ mInputs.r3a.focus(); }, 50);
      } else {
        resetFeedback('❌ جمع درست نیست، دوباره حساب کن.', 'wrong'); shake();
      }
      return;
    }

    if(comboStep==='sub'){
      var gotFinal = readAnswer(mInputs.r3a, mInputs.r3b);
      if(gotFinal===null){ resetFeedback('جواب تفریق رو بنویس ✍️'); return; }
      if(gotFinal===mission.answer2){
        lockAnswer(mInputs.r3a, mInputs.r3b, mission.answer2);
        celebrateDotAndAdvance();
      } else {
        resetFeedback('❌ اشتباهه، دوباره حساب کن.', 'wrong'); shake();
      }
      return;
    }
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('restartBtn').addEventListener('click', function(){
    winOverlay.style.display='none';
    loadStage(0);
  });

  // auto-advance focus & numeric-only input
  [pInputs.r3a,pInputs.r3b,mInputs.r3a,mInputs.r3b].forEach(function(el, idx, arr){
    el.addEventListener('input', function(){
      var v=this.value;
      var digitMatch = v.match(/[0-9۰-۹]/);
      this.value = digitMatch? digitMatch[0] : '';
      if(this.value && idx%2===0){ arr[idx+1].focus(); }
    });
    el.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ checkAnswer(); }
    });
  });

  loadStage(0);
})();
</script>
</body>
</html>
