<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>علوم نهم – فصل ۱: مواد و نقش آن‌ها در زندگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10283b;--bg:#e9eff3;--card:#fff;--tl:#0f9d8c;--cu:#c9733b;--au:#e8b13a;--ok:#1b9e5a;--bad:#d64545;--mut:#5b7186;--ln:#cbd7df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 Vazirmatn,Tahoma,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--au);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:8px 14px}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:860px;margin:auto}
.hr h1{font-size:15px;margin:0;flex:1;min-width:180px}
.hb{background:#ffffff1f;border:0;border-radius:8px;color:#fff;padding:2px 10px;font-size:13px}
#bar{height:6px;background:#ffffff33;border-radius:3px;max-width:860px;margin:6px auto 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--au);transition:width .5s}
main{max-width:860px;margin:0 auto;padding:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
nav button{flex:0 0 auto;min-width:92px;border:2px solid var(--ln);background:#fff;border-radius:10px;padding:4px 8px;text-align:center;line-height:1.4}
nav b{display:block;font-size:22px;color:var(--tl)}
nav small{font-size:12px;color:var(--mut)}
nav button.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
nav button.fin{background:#e3f6ec;border-color:var(--ok)}
nav button:disabled{opacity:.45;cursor:not-allowed}
h2{margin:6px 0 2px;font-size:24px}
.txt{background:#fff;border-right:6px solid var(--tl);border-radius:10px;padding:10px 16px;margin:14px 0}
.txt h3{margin:0;font-size:17px}.txt p{margin:4px 0}
.card{position:relative;background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:14px 16px;margin:14px 0}
.card.done{border-color:var(--ok)}
.card.done::after{content:"✓";position:absolute;top:8px;left:12px;color:#fff;background:var(--ok);width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;font-size:15px}
.q{margin:0 0 10px;font-weight:600}
.chip,.opt,.btn{border:2px solid var(--ln);background:#f7fafc;border-radius:10px;padding:4px 14px;margin:4px}
.chip.sel{border-color:var(--cu);background:#fbeadf}
.chip.placed{background:#e3f6ec;border-color:var(--ok);cursor:default}
.no{animation:sk .35s}@keyframes sk{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.buckets{display:flex;gap:10px;margin-top:8px}
.bucket{flex:1;border:2px dashed var(--mut);border-radius:12px;padding:6px;min-height:90px;cursor:pointer;text-align:center}
.bucket>b{color:var(--cu)}
.opt{display:block;width:100%;text-align:right}
.opt.ok{background:#e3f6ec;border-color:var(--ok)}.opt.bad{background:#fde8e8;border-color:var(--bad)}
.fb{margin:6px 0 0;min-height:1.5em;color:var(--mut);font-size:14px}
.btn{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text]{border:2px solid var(--ln);border-radius:10px;padding:4px 10px;width:150px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
.mt .chip{margin:0;width:100%}
.chip.mat{background:#e3f6ec;border-color:var(--ok);cursor:default}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fc{min-height:120px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:8px;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;text-align:center}
.fc.flip{background:#fff;color:var(--ink);font-weight:400;font-size:14px}
.sim{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.met{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);margin:3px}
.ord{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ord span{background:#e3f6ec;border:2px solid var(--ok);border-radius:10px;padding:2px 12px;width:100%}
.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;direction:ltr}
.pt button,.pt i{aspect-ratio:1;font-size:clamp(9px,2.4vw,14px);padding:0;border-radius:4px;border:1px solid var(--ln);background:#fff;font-weight:800}
.pt i{border:0;background:none}
.pt .p{background:#fbeadf}.pt .g{background:#d6f1ed}.pt .c{background:var(--ink);color:#fff}
.br{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:8px;font-size:14px}
.br div i{display:block;height:16px;background:var(--tl);border-radius:4px;width:0;transition:width .7s}
.chain{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:44px;direction:ltr}
.chain b{width:26px;height:26px;border-radius:50%;background:var(--cu);display:inline-block}
.chain s{width:10px;height:4px;background:var(--ink);display:inline-block}
.nx{display:flex;justify-content:space-between;margin:20px 0 40px}
#st{max-width:430px;margin:8vh auto;background:#fff;border-radius:16px;padding:22px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
#st label{display:block;margin:8px 0}#st input{width:100%}
dialog{border:2px solid var(--ink);border-radius:16px;padding:20px 26px;max-width:92vw;font-family:inherit;direction:rtl}
dialog::backdrop{background:#10283b99}
@media(max-width:520px){.buckets,.mt{grid-template-columns:1fr}.buckets{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hr"><h1>علوم نهم، فصل ۱: مواد و نقش آن‌ها در زندگی</h1>
<span id="tm">۰۰:۰۰</span><button class="hb" id="rp">گزارش</button><button class="hb" id="rs">شروع دوباره</button></div>
<div id="bar"><i></i></div></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e},
fa=x=>(+x).toLocaleString('fa-IR'),sh=a=>[...a].sort(()=>Math.random()-.5),
nm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[\s,،\-]/g,'').toLowerCase(),
shake=e=>{e.classList.add('no');setTimeout(()=>e.classList.remove('no'),400)};
let st;try{st=JSON.parse(localStorage.getItem('sci9'))}catch(e){}
st=st||{d:{},t:0,cur:0};
const save=()=>{try{localStorage.setItem('sci9',JSON.stringify(st))}catch(e){}};
const EL=['H هیدروژن','He هلیوم','Li لیتیم','Be بریلیم','B بور','C کربن','N نیتروژن','O اکسیژن','F فلوئور','Ne نئون','Na سدیم','Mg منیزیم','Al آلومینیوم','Si سیلیسیم','P فسفر','S گوگرد','Cl کلر','Ar آرگون'];
const shells=Z=>{let r=Z,s=[];for(const c of [2,8,8]){const k=Math.min(r,c);if(k>0)s.push(k);r-=k}return s};
const grp=Z=>{const v=shells(Z).pop();return Z==2?18:v<=2?v:10+v};
const info=Z=>{const s=shells(Z),e=EL[Z-1].split(' ');return `<b>${e[1]}</b> (${e[0]}) – عدد اتمی ${fa(Z)}<br>آرایش الکترونی: ${s.map(fa).join('، ')}<br>مدارها: ${fa(s.length)} (دورهٔ ${fa(s.length)}) – الکترون مدار آخر: ${fa(s.at(-1))} (گروه ${fa(grp(Z))})`};

const S=[
{s:'Au',t:'مواد اطراف ما',I:[
{k:'txt',h:'ماده و ذره',p:'همه‌چیز از ماده ساخته شده و هر ماده از ذره‌های ریزی (اتم و مولکول) تشکیل شده است. مواد را از دو دیدگاه دسته‌بندی می‌کنیم: منشأ (طبیعی یا مصنوعی) و خلوص (خالص یا مخلوط).'},
{k:'sort',q:'روی هر ماده بزن، بعد روی دستهٔ درستش.',b:['طبیعی','مصنوعی'],c:[['چوب',0],['پنبه',0],['ابریشم',0],['پلاستیک',1],['شیشه',1],['فولاد',1]]},
{k:'sort',q:'ماده‌های خالص و مخلوط را جدا کن.',b:['خالص','مخلوط'],c:[['طلا',0],['اکسیژن',0],['نمک خوراکی',0],['هوا',1],['شیر',1],['آب‌نمک',1]]},
{k:'mcq',q:'چرا آب لوله‌کشی مادهٔ خالص نیست؟',o:['چون رنگ ندارد','چون مواد دیگری در آن حل شده است','چون مایع است'],a:1,e:'آب لوله‌کشی مخلوطی از آب و مواد محلول است.'}]},
{s:'NaCl',t:'عنصر، ترکیب و مخلوط',I:[
{k:'txt',h:'سه مفهوم کلیدی',p:'<b>عنصر:</b> فقط یک نوع اتم (Au، O₂، Fe).<br><b>ترکیب:</b> دو یا چند نوع اتم با پیوند شیمیایی (H₂O، NaCl، CO₂).<br><b>مخلوط:</b> چند ماده کنار هم بدون واکنش شیمیایی؛ همگن (محلول) یا ناهمگن.'},
{k:'sort',q:'عنصر یا ترکیب؟',b:['عنصر','ترکیب'],c:[['Au',0],['O₂',0],['Fe',0],['H₂O',1],['NaCl',1],['CO₂',1]]},
{k:'sort',q:'مخلوط همگن (یکنواخت) یا ناهمگن؟',b:['همگن','ناهمگن'],c:[['آب‌نمک',0],['هوا',0],['شکر در آب',0],['آجیل',1],['دوغ',1],['آب گل‌آلود',1]]},
{k:'fill',q:'مولکول آب از ___ اتم هیدروژن و یک اتم اکسیژن ساخته شده است.',a:['2','دو']},
{k:'mcq',q:'هوا مادهٔ خالص است؟',o:['بله، چون دیده نمی‌شود','نه، مخلوط یکنواخت (همگن) چند گاز است'],a:1,e:'هوا مخلوطی از نیتروژن، اکسیژن و گازهای دیگر است.'}]},
{s:'Mg',t:'فلزها و واکنش‌پذیری',I:[
{k:'txt',h:'فلز و نافلز',p:'فلزها براق، چکش‌خوار، مفتول‌پذیر و رسانای خوب گرما و برق‌اند. نافلزهای جامد مات و شکننده‌اند و رسانای ضعیف (عایق).'},
{k:'sort',q:'ویژگی‌ها را به فلز یا نافلز نسبت بده.',b:['فلز','نافلز'],c:[['براق',0],['چکش‌خوار',0],['رسانای خوب برق',0],['مات',1],['شکننده',1],['عایق',1]]},
{k:'flash',q:'کارت‌ها را بچرخان و کاربرد هر فلز را بخوان.',c:[['مس','سیم برق و ظروف پخت‌وپز؛ رسانایی بالا و مقاومت در برابر خوردگی'],['طلا','زیورآلات و قطعات الکترونیکی؛ با اکسیژن واکنش نمی‌دهد'],['آلومینیوم','بدنهٔ هواپیما و قوطی؛ سبک و مقاوم در برابر زنگ‌زدگی'],['آهن','خانه، پل و خودرو (به‌ویژه به‌صورت فولاد)']]},
{k:'txt',h:'آزمایش مجازی',p:'تیغهٔ فلز را در محلول آبی کات کبود (مس سولفات) بینداز. هرچه رنگ آبی سریع‌تر کم‌رنگ شود، فلز واکنش‌پذیرتر است.'},
{k:'sim'},
{k:'order',q:'فلزها را از کم‌واکنش‌پذیر به پرواکنش‌پذیر مرتب کن (به ترتیب بزن).',s:['طلا','مس','آهن','روی','منیزیم']},
{k:'mcq',q:'در شرایط یکسان کدام زودتر زنگ می‌زند؟',o:['ظرف مسی','ظرف آهنی'],a:1,e:'واکنش‌پذیری آهن با اکسیژن بیشتر از مس است.'}]},
{s:'Ne',t:'اتم بور و جدول تناوبی',I:[
{k:'txt',h:'مدل بور',p:'الکترون‌ها در مدارهای مشخصی دور هسته می‌چرخند: مدار اول تا ۲ الکترون، مدار دوم تا ۸ و مدار سوم (در علوم نهم) تا ۸. الکترون‌های مدار آخر خواص شیمیایی عنصر را تعیین می‌کنند.'},
{k:'atom'},
{k:'fill',q:'آرایش الکترونی سدیم (۱۱Na) را بنویس. (مثل: ۲، ۸، ...)',a:['2,8,1']},
{k:'txt',h:'جدول تناوبی',p:'ردیف افقی = دوره = تعداد مدارها. ستون عمودی = گروه = تعداد الکترون مدار آخر یکسان و خواص شیمیایی مشابه.'},
{k:'ptab'},
{k:'mcq',q:'کدام عنصر به سدیم (Na) شبیه‌تر است؟',o:['منیزیم (Mg)','لیتیم (Li)'],a:1,e:'هر دو یک الکترون در مدار آخر دارند و در گروه ۱ هستند.'},
{k:'mcq',q:'مدل اتمی کربن به کدام عنصر شبیه‌تر است؟',o:['نیتروژن','سیلیسیم'],a:1,e:'کربن (۲،۴) و سیلیسیم (۲،۸،۴) هر دو ۴ الکترون در مدار آخر دارند.'}]},
{s:'N₂',t:'نیتروژن و عنصرهای زندگی',I:[
{k:'txt',h:'چرخهٔ نیتروژن',p:'نیتروژن ۷۸٪ هوا را می‌سازد، اما گیاهان و جانوران نمی‌توانند مستقیم از آن استفاده کنند.'},
{k:'order',q:'مراحل چرخه را به ترتیب بزن.',s:['باکتری‌ها و صاعقه نیتروژن هوا را تثبیت می‌کنند','ریشهٔ گیاه ترکیب‌های نیتروژن‌دار خاک را جذب می‌کند','جانور گیاه‌خوار گیاه را می‌خورد','باکتری‌ها بقایای مرده را تجزیه می‌کنند','نیتروژن به‌صورت گاز به هوا برمی‌گردد']},
{k:'txt',h:'فراوانی عنصرها',p:'بدن انسان و پوستهٔ زمین را مقایسه کن.'},
{k:'bars'},
{k:'mcq',q:'سیلیسیم و آلومینیوم در بدن انسان فراوان‌اند.',o:['درست','نادرست'],a:1,e:'در پوستهٔ زمین فراوان‌اند، اما در بدن بسیار کم.'}]},
{s:'C',t:'بسپارها و بازیافت',I:[
{k:'txt',h:'بسپار (پلیمر)',p:'مولکول بسیار بزرگی که از تکرار واحدهای کوچک به نام تکپار ساخته می‌شود. طبیعی: نشاسته، سلولز، پروتئین، پشم، ابریشم، پنبه. مصنوعی: پلاستیک‌ها و نایلون.'},
{k:'poly'},
{k:'match',q:'بسپار طبیعی را به کاربردش وصل کن.',p:[['نشاسته','نان و برنج'],['سلولز','کاغذ و پارچهٔ نخی'],['ابریشم','نخ جراحی'],['پروتئین','مو و ناخن']]},
{k:'match',q:'کد بازیافت را به کاربرد پلاستیک وصل کن.',p:[['۱ (PETE)','بطری آب'],['۲ (HDPE)','قوطی شوینده'],['۳ (PVC)','لوله'],['۶ (PS)','فوم و ظرف یک‌بار مصرف']]},
{k:'mcq',q:'چرا باید مواد را بهینه مصرف و بازیافت کنیم؟',o:['چون منابع زمین محدودند و به نسل‌های بعد هم تعلق دارند','چون مواد همیشه ارزان‌اند'],a:0,e:'مصرف بهینه و بازیافت از منابع و محیط زیست محافظت می‌کند.'}]}
];

const W={
sort(it,ok){const w=mk('div');w.append(mk('p','q',it.q));let sel=null,left=it.c.length;const bk=mk('div','buckets'),pl=mk('div');
it.b.forEach((b,bi)=>{const d=mk('div','bucket','<b>'+b+'</b><div></div>');d.onclick=()=>{if(!sel)return;if(sel.bi==bi){d.lastChild.append(sel.el);sel.el.className='chip placed';sel.el.onclick=null;sel=null;if(!--left)ok()}else shake(sel.el)};bk.append(d)});
sh(it.c).forEach(([t,bi])=>{const c=mk('button','chip',t);c.onclick=()=>{if(sel)sel.el.classList.remove('sel');sel={el:c,bi};c.classList.add('sel')};pl.append(c)});
w.append(pl,bk);return w},
mcq(it,ok){const w=mk('div');w.append(mk('p','q',it.q));const fb=mk('p','fb');
it.o.forEach((o,i)=>{const b=mk('button','opt',o);b.onclick=()=>{if(i==it.a){b.classList.add('ok');fb.textContent='درست! '+it.e;w.querySelectorAll('.opt').forEach(x=>x.disabled=true);ok()}else{b.classList.add('bad');fb.textContent='این گزینه درست نیست؛ دوباره فکر کن.';shake(b)}};w.append(b)});w.append(fb);return w},
fill(it,ok){const w=mk('div');w.append(mk('p','q',it.q));const i=mk('input');i.type='text';const b=mk('button','btn','بررسی'),fb=mk('p','fb');
b.onclick=()=>{if(it.a.map(nm).includes(nm(i.value))){fb.textContent='درست است!';ok()}else{fb.textContent='پاسخ درست نیست؛ دوباره امتحان کن.';shake(i)}};w.append(i,b,fb);return w},
match(it,ok){const w=mk('div');w.append(mk('p','q',it.q));const g=mk('div','mt');let sl=null,n=it.p.length;
const L=it.p.map((p,i)=>[p[0],i]),R=sh(it.p.map((p,i)=>[p[1],i]));
const col=(arr,side)=>arr.map(([t,i])=>{const c=mk('button','chip',t);c.onclick=()=>{if(c.classList.contains('mat'))return;
if(side=='l'){if(sl)sl.el.classList.remove('sel');sl={el:c,i};c.classList.add('sel')}
else if(sl){if(sl.i==i){sl.el.className=c.className='chip mat';sl=null;if(!--n)ok()}else shake(c)}};return c});
const l=col(L,'l'),r=col(R,'r');l.forEach((x,i)=>g.append(x,r[i]));w.append(g);return w},
order(it,ok){const w=mk('div');w.append(mk('p','q',it.q));let k=0;const res=mk('div','ord'),pl=mk('div');
sh(it.s.map((t,i)=>[t,i])).forEach(([t,i])=>{const c=mk('button','chip',t);c.onclick=()=>{if(i==k){c.remove();res.append(mk('span','',fa(k+1)+'. '+t));if(++k==it.s.length)ok()}else shake(c)};pl.append(c)});
w.append(pl,res);return w},
flash(it,ok){const w=mk('div');w.append(mk('p','q',it.q));const g=mk('div','fl');let seen=new Set;
it.c.forEach(([f,b],i)=>{const c=mk('button','fc',f);c.onclick=()=>{c.classList.toggle('flip');c.textContent=c.classList.contains('flip')?b:f;seen.add(i);if(seen.size==it.c.length)ok()};g.append(c)});w.append(g);return w},
sim(it,ok){const w=mk('div','sim');const M=[['منیزیم','#cfd3d6',3,'#dbe8f2','سریع'],['روی','#9fb0bd',7,'#d3e4ee','کند'],['آهن','#6b7580',12,'#cfe3d8','خیلی کند'],['مس','#c9733b',0,'','بدون تغییر'],['طلا','#e8b13a',0,'','بدون تغییر']];
w.innerHTML='<svg viewBox="0 0 200 170" width="220" aria-label="بشر محلول کات کبود"><path d="M40 20V140Q40 155 55 155H145Q160 155 160 140V20" fill="none" stroke="#10283b" stroke-width="4"/><rect id="lq" x="44" y="70" width="112" height="82" rx="8" style="fill:#2d7de0"/><rect id="mt" x="94" y="0" width="12" height="100" style="fill:#999;transform:translateY(-120px)"/></svg>';
const side=mk('div');side.innerHTML='<p class="q">کدام فلز را بیندازیم؟</p>';const out=mk('p','fb','یک فلز انتخاب کن.');const tried=new Set;
M.forEach(m=>{const b=mk('button','chip',m[0]);b.onclick=()=>{const lq=w.querySelector('#lq'),mt=w.querySelector('#mt');lq.style.transition=mt.style.transition='none';lq.style.fill='#2d7de0';mt.style.fill=m[1];mt.style.transform='translateY(-120px)';void lq.getBoundingClientRect();
mt.style.transition='transform .6s';mt.style.transform='translateY(0)';if(m[2]){lq.style.transition='fill '+m[2]+'s linear';lq.style.fill=m[3]}
out.textContent=m[0]+': تغییر رنگ '+m[4]+(m[2]?'':' (واکنشی دیده نمی‌شود)');tried.add(m[0]);if(tried.size>=4)ok()};side.append(b)});
side.append(out);w.append(side);return w},
atom(it,ok){const w=mk('div');w.append(mk('p','q','عدد اتمی را تغییر بده و مدل بور را ببین. (دایرهٔ نارنجی = مدار آخر)'));const r=mk('input');r.type='range';r.min=1;r.max=18;r.value=1;r.style.width='100%';r.dir='ltr';
const sv=mk('div'),f=mk('p','fb');const seen=new Set;
const draw=()=>{const Z=+r.value,s=shells(Z);let h='<svg viewBox="0 0 240 240" width="240" style="display:block;margin:auto">';
s.forEach((n,i)=>{const R=38+i*28;h+=`<circle cx="120" cy="120" r="${R}" fill="none" stroke="#cbd7df" stroke-dasharray="4 4"/>`;for(let k=0;k<n;k++){const a=2*Math.PI*k/n-Math.PI/2;h+=`<circle cx="${120+R*Math.cos(a)}" cy="${120+R*Math.sin(a)}" r="6" fill="${i==s.length-1?'#c9733b':'#0f9d8c'}"/>`}});
h+=`<circle cx="120" cy="120" r="17" fill="#10283b"/><text x="120" y="126" fill="#fff" text-anchor="middle" font-size="15" font-weight="800">${EL[Z-1].split(' ')[0]}</text></svg>`;sv.innerHTML=h;f.innerHTML=info(Z);f.style.color='#10283b';seen.add(Z);if(seen.size>=4)ok()};
r.oninput=draw;draw();w.append(r,sv,f);return w},
ptab(it,ok){const w=mk('div');w.append(mk('p','q','روی یک عنصر بزن تا گروه و دورهٔ آن مشخص شود.'));const g=mk('div','pt'),f=mk('p','fb'),cells=[];let cl=0;
const pos={};[[1,1],[2,18]].forEach(([z,c])=>pos['0'+c]=z);for(let c=0;c<2;c++)pos['1'+(c+1)]=3+c,pos['2'+(c+1)]=11+c;for(let c=0;c<6;c++)pos['1'+(13+c)]=5+c,pos['2'+(13+c)]=13+c;
for(let r=0;r<3;r++)for(let c=1;c<=18;c++){const Z=pos[r+''+c];if(!Z){g.append(mk('i'));continue}const b=mk('button','',EL[Z-1].split(' ')[0]);b.onclick=()=>{cells.forEach(x=>x.b.className='');cells.forEach(x=>{if(x.c==c)x.b.classList.add('g');else if(x.r==r)x.b.classList.add('p')});b.className='c';f.innerHTML=info(Z);f.style.color='#10283b';if(++cl>=3)ok()};cells.push({b,r,c});g.append(b)}
w.append(g,f);return w},
bars(it,ok){const w=mk('div');const D={'بدن انسان':[['اکسیژن',65],['کربن',18],['هیدروژن',10],['نیتروژن',3],['کلسیم',2],['سایر',2]],'پوستهٔ زمین':[['اکسیژن',47],['سیلیسیم',28],['آلومینیوم',8],['آهن',5],['کلسیم',4],['سدیم',3],['پتاسیم',3],['سایر',2]]};
const tabs=mk('div'),box=mk('div');const seen=new Set;
Object.keys(D).forEach(k=>{const b=mk('button','chip',k);b.onclick=()=>{box.innerHTML='';D[k].forEach(([n,v])=>{const r=mk('div','br',`<span>${n}</span><div><i></i></div><span>${fa(v)}٪</span>`);box.append(r);setTimeout(()=>r.querySelector('i').style.width=v*1.5+'%',30)});seen.add(k);if(seen.size==2)ok()};tabs.append(b)});
w.append(tabs,box);tabs.firstChild.click();return w},
poly(it,ok){const w=mk('div');w.append(mk('p','q','تکپار اضافه کن تا بسپار بسازی. (حداقل ۶ تکپار)'));const ch=mk('div','chain'),f=mk('p','fb');let n=0;
const a=mk('button','btn','افزودن تکپار'),c=mk('button','chip','پاک کردن');
a.onclick=()=>{if(n>=14)return;if(n)ch.append(mk('s'));ch.append(mk('b'));n++;f.textContent=fa(n)+' تکپار به هم پیوسته‌اند'+(n>=6?' و یک بسپار ساخته شد؛ مثل پلی‌اتن از اتن.':'.');if(n>=6)ok()};
c.onclick=()=>{ch.innerHTML='';n=0;f.textContent=''};w.append(ch,a,c,f);return w}};

const tasks=i=>S[i].I.map((x,j)=>x.k=='txt'?0:i+'-'+j).filter(Boolean),sdone=i=>tasks(i).every(id=>st.d[id]),open_=i=>!i||sdone(i-1);
const all=S.flatMap((_,i)=>tasks(i));
function upd(){const n=all.filter(id=>st.d[id]).length;$('#bar i').style.width=n/all.length*100+'%';
document.querySelectorAll('nav button').forEach((b,i)=>{b.disabled=!open_(i);b.classList.toggle('fin',sdone(i));b.classList.toggle('on',i==st.cur)});
const nx=$('#nx');if(nx)nx.disabled=!sdone(st.cur)}
function ok(id){if(!st.d[id]){st.d[id]=1;save()}upd();if(all.every(i=>st.d[i])&&!st.fin){st.fin=1;save();setTimeout(rep,700)}}
function show(i){st.cur=i;save();const m=$('#app');m.innerHTML='';const nav=mk('nav');
S.forEach((s,j)=>{const b=mk('button','',`<b>${s.s}</b><small>${s.t}</small>`);b.onclick=()=>show(j);nav.append(b)});m.append(nav,mk('h2','',s_(i)));
S[i].I.forEach((it,j)=>{if(it.k=='txt'){m.append(mk('div','txt',`<h3>${it.h}</h3><p>${it.p}</p>`));return}
const id=i+'-'+j,c=mk('div','card'+(st.d[id]?' done':''));c.append(W[it.k](it,()=>{c.classList.add('done');ok(id)}));m.append(c)});
const f=mk('div','nx'),pv=mk('button','chip','مرحله قبل'),nx=mk('button','btn',i==S.length-1?'مشاهدهٔ گزارش':'مرحله بعد');nx.id='nx';
pv.disabled=!i;pv.onclick=()=>show(i-1);nx.onclick=()=>i==S.length-1?rep():show(i+1);f.append(pv,nx);m.append(f);upd();scrollTo(0,0)}
const s_=i=>`مرحلهٔ ${fa(i+1)}: ${S[i].t}`;
const clk=()=>{const t=st.t||0;return fa(String(Math.floor(t/60)).padStart(2,'0'))+':'+fa(String(t%60).padStart(2,'0'))};
function rep(){const n=all.filter(id=>st.d[id]).length,u=st.u||{};const d=$('#dlg');
d.innerHTML=`<h2>گزارش یادگیری</h2><p>نام: <b>${u.n||''} ${u.f||''}</b><br>کلاس: <b>${u.c||''}</b><br>وضعیت: <b>${n==all.length?'درس کامل شد 🎉':'ناتمام ('+fa(n)+' از '+fa(all.length)+' فعالیت)'}</b><br>زمان حضور در درس: <b>${clk()}</b></p><button class="btn" id="cl">بستن</button> <button class="chip" id="r2">شروع دوباره</button>`;
d.showModal();$('#cl').onclick=()=>d.close();$('#r2').onclick=reset}
function reset(){if(!confirm('همهٔ پیشرفت پاک شود و از اول شروع کنی؟'))return;try{localStorage.removeItem('sci9')}catch(e){}location.reload()}
function start(){if(!st.u){const a=$('#app');a.innerHTML='<div id="st"><h2>خوش آمدی!</h2><p>قبل از شروع، اطلاعاتت را وارد کن.</p><label>نام<input type="text" id="u1"></label><label>نام خانوادگی<input type="text" id="u2"></label><label>کلاس<input type="text" id="u3"></label><button class="btn" id="go">شروع درس</button></div>';
$('#go').onclick=()=>{const v=[1,2,3].map(i=>$('#u'+i).value.trim());if(v.includes(''))return shake($('#st'));st.u={n:v[0],f:v[1],c:v[2]};save();show(0)};return}
show(open_(st.cur)?st.cur:0)}
$('#rp').onclick=rep;$('#rs').onclick=reset;
setInterval(()=>{if(st.u&&!document.hidden){st.t=(st.t||0)+1;save();$('#tm').textContent=clk()}},1000);
$('#tm').textContent=clk();start();
</script>
