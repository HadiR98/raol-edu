<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پارک بازی ریاضی</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🌳 پارک بازی ریاضی</h1><p>با سنجاب کوچولو تا خانه درختی!</p><div id="hud"><span>⭐ <b id=stars>0</b></span><span>مرحله <b id=stage>1</b>/5</span><div class=bar><div id=fill></div></div></div></header>
<main class=park><section class="panel active" id=p0><img src="assets/squirrel.svg" class=mascot><h2>شروع ماجراجویی</h2><p>۵ مرحله برای قهرمان شدن.</p><button onclick="go(1)">شروع</button></section>
<section class=panel id=p1><h2>شکار گنج</h2><div class=math>70 − 30</div><button class=opt onclick="pick(this,false)">30</button><button class=opt onclick="pick(this,true)">40</button><button class=opt onclick="pick(this,false)">50</button></section>
<section class=panel id=p2><h2>کارخانه ده‌تایی</h2><div class=math>35 + 22</div><div id=blocks></div><button onclick="build()">ساخت بلوک‌ها</button><button class=opt onclick="pick(this,false)">54</button><button class=opt onclick="pick(this,true)">57</button></section>
<section class=panel id=p3><h2>قورباغه روی محور</h2><svg viewBox="0 0 420 90"><line x1=20 y1=45 x2=400 y2=45 stroke="#345" stroke-width=4/><circle id=frog cx=172 cy=45 r=10 fill="#4caf50"/></svg><div><button onclick="hop(38)">+۱۰</button><button onclick="hop(11.4)">+۱</button></div><button onclick="checkHop()">رسیدم</button></section>
<section class=panel id=p4><h2>ربات ریاضی</h2><div class=math>47 − 22</div><button class=opt onclick="pick(this,false)">27</button><button class=opt onclick="pick(this,true)">25</button></section>
<section class=panel id=p5><h2>🏡 خانه درختی</h2><p>قهرمان شدی!</p><div id=medal>🥇</div><p id=result></p><button onclick="party()">جشن</button></section></main><div id=conf></div><script src="app.js"></script></body></html>
