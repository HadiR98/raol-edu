<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ریاضی عددهای دو رقمی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#ffe9a8;--bg2:#c9f0ff;--card:#fff;--ink:#3a2f6b;--ok:#2fbf71;--bad:#ff5d73;--in:#fff8e1}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b2f63;--bg2:#1f3b5c;--card:#2c2850;--ink:#fff3d6;--in:#3d3870}}
:root[data-theme="dark"]{--bg1:#3b2f63;--bg2:#1f3b5c;--card:#2c2850;--ink:#fff3d6;--in:#3d3870}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 90px}
#bar{position:sticky;top:0;z-index:5;background:var(--card);border-radius:0 0 22px 22px;padding:8px 14px;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:720px;margin:0 auto}
#bar .r{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}
#pg{height:12px;background:var(--in);border-radius:9px;margin-top:6px;overflow:hidden}
#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a5c,#ffd23f,#2fbf71);border-radius:9px;transition:width .4s}
h2{display:inline-block;background:var(--c);color:#fff;border-radius:30px;padding:6px 18px;margin:22px 0 4px;font-size:19px}
.card{background:var(--card);border-radius:24px;border:4px solid var(--c);padding:14px;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.12)}
h3{margin:0 0 6px;font-size:17px;line-height:1.8}
.ln{line-height:2.5;font-size:18px;margin:4px 0}.ln.m{direction:ltr;text-align:center}
input,select{font:inherit;font-weight:800;font-size:18px;text-align:center;border:3px solid var(--c);border-radius:12px;background:var(--in);color:var(--ink);padding:3px;margin:2px;max-width:100%}
input.n{direction:ltr}
.ok{border-color:var(--ok)!important;background:#d9f9e6!important;color:#145a35!important}
.bad{border-color:var(--bad)!important;background:#ffe0e5!important;color:#8a1f33!important}
em{font-style:normal;color:var(--ok);font-weight:800;font-size:15px;margin:0 2px}
.axis{display:flex;direction:ltr;gap:4px;overflow-x:auto;padding:4px 0 8px}
.axis i{flex:0 0 auto;min-width:36px;text-align:center;font-style:normal;font-weight:800;background:var(--in);border-radius:10px;padding:4px 2px;border-bottom:4px solid var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;direction:ltr;margin:6px 0}
.cell{font:inherit;font-weight:800;font-size:17px;border:3px solid #bbb;border-radius:14px;padding:12px 4px;background:var(--in);color:var(--ink)}
.cell.v1{background:#4aa8ff;color:#fff;border-color:#2b7fd1}.cell.v2{background:#ff5d73;color:#fff;border-color:#d63c54}
button.b{font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--c);border:0;border-radius:30px;padding:10px 22px;margin-top:8px;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}
button.b:active{transform:translateY(3px);box-shadow:none}
.fb{font-weight:800;margin-top:6px}
#start{max-width:460px;margin:30px auto;padding:0 14px;text-align:center}
#start .card{--c:#ff8a5c;padding:24px 18px}
#start input{width:100%;margin:6px 0;font-size:19px;padding:10px}
.big{font-size:64px;line-height:1}
#res{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;z-index:6}
#res button{width:100%;--c:#2fbf71}
#pop{position:fixed;inset:0;background:rgba(30,20,70,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#pop .card{--c:#ffb400;max-width:380px;width:100%;text-align:center;padding:22px;animation:pp .5s}
@keyframes pp{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.st{font-size:36px;letter-spacing:4px}.row{font-size:19px;font-weight:800;margin:8px 0}
.sec{background:transparent;color:var(--ink);text-decoration:underline;border:0;font:inherit;margin-top:10px;cursor:pointer}
.hint{background:#fff3b0;color:#5a4300;border-radius:14px;padding:8px 12px;margin:6px 0;line-height:1.9;font-weight:700}
.ax{width:100%;max-width:520px;display:block;margin:0 auto;color:var(--ink)}.ax circle{fill:var(--card);stroke:var(--c);stroke-width:3;cursor:pointer}.ax circle.s{fill:#2fbf71}.ax circle.e{fill:#ff5d73}.ax text{fill:currentColor;font-size:11px;text-anchor:middle;font-weight:700}
.rs,.mb{font:inherit;font-weight:700;border:2px solid var(--c);background:var(--in);color:var(--ink);border-radius:20px;padding:4px 12px;margin:4px;cursor:pointer}.mb.on{background:var(--c);color:#fff}
.fig{display:inline-block;vertical-align:top;background:var(--in);border-radius:14px;padding:6px 10px;margin:4px;direction:ltr}.fig small{display:block;text-align:center;font-weight:700}
.t{display:inline-block;width:12px;height:40px;background:repeating-linear-gradient(#4aa8ff 0 3px,#fff 3px 4px);border:2px solid #2b7fd1;border-radius:3px;margin:2px;vertical-align:bottom}
.o{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ffb400;border:2px solid #d98e00;margin:2px;vertical-align:bottom}
.cut{opacity:.3;outline:2px dashed var(--bad)}.op{font-size:26px;font-weight:800;margin:0 8px}
.tr{display:flex;align-items:center;gap:6px;margin:4px 0}.tr small{width:60px}.tv{display:flex;flex-wrap:wrap;min-height:36px;flex:1;direction:ltr;background:var(--in);border-radius:10px;padding:2px 4px}.cn{font-weight:800;min-width:26px}
.g{display:inline-block;position:relative;margin:0 5px}.g i{display:inline-block;width:3px;height:30px;background:var(--ink);margin:0 3px;border-radius:2px}.g u{position:absolute;left:-2px;right:-2px;top:13px;height:3px;background:#ff5d73;transform:rotate(-20deg)}
.zone{min-height:70px;border:3px dashed var(--c);border-radius:16px;padding:8px;margin:6px 0;background:var(--in);direction:ltr}.tray{display:flex;gap:30px;padding:8px;direction:ltr}.dr{touch-action:none;cursor:grab}.tray .t{width:20px;height:60px}.tray .o{width:26px;height:26px}
.gh{position:fixed;pointer-events:none;z-index:50;opacity:.85}
.col{display:inline-block;margin:6px 12px;vertical-align:top}.col hr{border:0;border-top:3px solid var(--ink);margin:2px 0}.cr{text-align:right;width:4.6em;font-size:24px;font-weight:800;position:relative;line-height:1.5}.cr s{position:absolute;left:0;text-decoration:none}.cr input{width:1.9em!important;font-size:22px;margin:1px}
.tree{display:inline-block;text-align:center;margin:6px 10px;vertical-align:top;direction:ltr}.tree .rt{background:var(--c);color:#fff;border-radius:14px;padding:4px 14px;font-weight:800}.tree svg{display:block;width:170px;margin:0 auto;color:var(--c)}.tree .bs{display:flex;gap:10px}.tree .bs div{font-weight:700;font-size:14px}.tree input{width:4em!important}
.clk{width:min(250px,80%);display:block;margin:6px auto;touch-action:none;color:var(--ink)}.clk text{fill:currentColor}.tg,.zc{text-align:center;font-weight:800;margin:4px 0}.lt{display:inline-block}

  const mth=!/[آ-ی]/.test(L.replace(/\{[^}]*\}/g,''));

 h+=`<button class="b chk">${q.d?'✅ انجام دادم':'بررسی ✔'}</button><div class="fb"></div>`;

 if(!q.d){okOf(q,s).forEach(x=>{if(x)ok++});q.Z.forEach(([k,e])=>{if(s.w[k]==e)ok++})}
